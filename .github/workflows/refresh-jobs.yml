name: Refresh public job leads

on:
  workflow_dispatch:
  schedule:
    # Run around 09:17 Hong Kong time (UTC+8) each day.
    # GitHub may delay a scheduled run.
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: career-radar-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate public job data
        run: python scripts/refresh_jobs.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public job leads"
            git push
          else
            echo "No changes"
          fi
